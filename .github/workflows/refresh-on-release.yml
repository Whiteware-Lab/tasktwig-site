name: Refresh website on public release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Build Pages from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
